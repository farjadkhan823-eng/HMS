<div class="main">
    <div class="contact-wrapper">
        <div class="contact-box">
            <h3>Contact</h3>

            <div class="mb-3">
                <label>Message</label>
                <textarea id="message" class="form-control" name="message" [(ngModel)]="message" placeholder="Type your message..."></textarea>
            </div>

            <button class="btn submit-btn w-100" (click)="submitForm()">Submit</button>
        </div>
    </div>
</div>
